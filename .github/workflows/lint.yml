name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rodar ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          # -S style: falha em qualquer apontamento, inclusive estilo
          find . -name '*.sh' -print0 | xargs -0 shellcheck -S style

  endings:
    name: Quebras de linha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # CRLF num .sh quebra o script em Linux/macOS ("bad interpreter").
      # O .gitattributes previne, isto aqui é a rede de segurança.
      - name: Garantir LF nos scripts
        run: |
          bad=$(find . -name '*.sh' -exec grep -lU $'\r' {} + || true)
          if [ -n "$bad" ]; then
            echo "::error::Arquivos com CRLF (precisam de LF):"
            echo "$bad"
            exit 1
          fi
          echo "Todos os .sh estão em LF."

  syntax:
    name: Parse check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe (bash -n)
        run: |
          fail=0
          for f in $(find . -name '*.sh'); do
            if bash -n "$f"; then echo "OK  $f"; else echo "::error file=$f::erro de sintaxe"; fail=1; fi
          done
          exit $fail
