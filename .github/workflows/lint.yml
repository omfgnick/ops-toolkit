name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          if ($results) {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          }
          $blocking = @($results | Where-Object { $_.Severity -in 'Error', 'Warning' })
          Write-Host "PSScriptAnalyzer findings: Error/Warning = $($blocking.Count), total = $(@($results).Count)"
          if ($blocking.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($blocking.Count) blocking finding(s)."
          }
          Write-Host "PSScriptAnalyzer passed with no Error/Warning findings."

  syntax:
    name: Parse check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::Parse errors in $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { throw "One or more scripts failed to parse." }
