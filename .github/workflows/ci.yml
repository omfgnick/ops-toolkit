name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Vale para todos os jobs: sem isto o apt pode parar esperando um prompt que
# ninguém vai responder, e o job fica pendurado até o timeout. Já aconteceu duas
# vezes aqui — uma no shellcheck, outra na validação de schema.
env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  bash:
    name: Bash — shellcheck + sintaxe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Versão fixa: o shellcheck do apt é mais antigo que o usado localmente e
      # as duas discordavam sobre alguns apontamentos (SC2015, por exemplo).
      - name: ShellCheck ${{ env.SHELLCHECK_VERSION }}
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          # Baixa em arquivo (não em pipe) e com retry: o download já falhou uma
          # vez com 'connection reset', e num pipe o erro só aparece como tar
          # corrompido, mascarando a causa real.
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors -o shellcheck.tar.xz "$url"
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version
          # -S style: falha em qualquer apontamento, inclusive de estilo
          find bash tools tests -name '*.sh' -print0 | xargs -0 ./shellcheck -S style
          ./shellcheck -S style ./*.sh

      - name: Sintaxe (bash -n)
        run: |
          fail=0
          for f in $(find bash -name '*.sh'); do
            if bash -n "$f"; then echo "OK  $f"; else echo "::error file=$f::erro de sintaxe"; fail=1; fi
          done
          exit $fail

  powershell:
    name: PowerShell — PSScriptAnalyzer + parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          # Arquivo a arquivo, e não pasta a pasta: o PSScriptAnalyzer já
          # estourou com NullReferenceException aqui, e analisando a pasta
          # inteira o erro não diz em qual arquivo foi - o job morre sem
          # informação nenhuma. Assim o arquivo aparece no log.
          $results = @()
          $crashed = @()
          $files = Get-ChildItem ./powershell, ./debloat -Recurse -File -Include *.ps1, *.psm1, *.psd1
          foreach ($f in $files) {
            try {
              $results += Invoke-ScriptAnalyzer -Path $f.FullName -Settings $settings
            } catch {
              $crashed += "$($f.Name): $($_.Exception.Message)"
              Write-Host "::error file=$($f.Name)::PSScriptAnalyzer estourou neste arquivo: $($_.Exception.Message)"
            }
          }
          Write-Host "Arquivos analisados: $($files.Count)"
          if ($crashed) { throw "PSScriptAnalyzer estourou em $($crashed.Count) arquivo(s)." }
          if ($results) { $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message }
          $blocking = @($results | Where-Object { $_.Severity -in 'Error', 'Warning' })
          Write-Host "Apontamentos: Error/Warning = $($blocking.Count), total = $(@($results).Count)"
          if ($blocking.Count -gt 0) { throw "PSScriptAnalyzer reportou $($blocking.Count) apontamento(s) bloqueante(s)." }

      - name: Parse check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ./powershell, ./debloat -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::Erros de parse em $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
            } else { Write-Host "OK  $($_.Name)" }
          }
          if ($failed) { throw "Um ou mais scripts falharam no parse." }

  bats:
    name: Bats — testes Bash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar bats e jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats jq

      - name: Rodar testes
        run: bats --print-output-on-failure tests/bash

  schemas:
    name: Contrato JSON + integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar dependências
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-jsonschema openssl curl iputils-ping

      # Roda os scripts de verdade (com servidor HTTP e TLS locais) e valida a
      # saída --json contra schemas/. É o que garante que quem consome o JSON
      # não quebra por uma mudança silenciosa de formato.
      - name: Validar saída contra os schemas
        run: bash tests/validate-schemas.sh

  bats-matrix:
    name: Bats — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distro: [debian:12, rockylinux:9]
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7

      # Os scripts assumem coreutils GNU. Rodar fora do Ubuntu é o que pega
      # dependência acidental de distro — foi assim que apareceu o bug do
      # sshd_config, que só existia onde o arquivo era legível.
      - name: Instalar dependências
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq bats jq curl openssl
          else
            dnf install -y -q jq git openssl
            # O Rocky já traz curl-minimal, que conflita com o pacote 'curl'
            # completo; o binário é o mesmo, então só instala se faltar.
            command -v curl >/dev/null || dnf install -y -q --allowerasing curl
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh /usr/local
          fi

      - name: Rodar testes
        run: bats --print-output-on-failure tests/bash

  pester:
    name: Pester — testes PowerShell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Versão fixa: o Pester 6 mudou o suficiente para quebrar a suíte, e um
      # teste que muda de comportamento sozinho não serve como rede.
      - name: Rodar testes
        shell: pwsh
        env:
          PESTER_VERSION: 5.7.1
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $r = Invoke-Pester -Path ./tests/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) teste(s) falharam." }
          Write-Host "Pester: $($r.PassedCount) teste(s) passaram."

  windows:
    name: Windows — execução real
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Até aqui o CI só sabia dizer "compila e passa no analyzer". Este job é o
      # que permite dizer "roda": os scripts somente-leitura são executados de
      # fato, num Windows de verdade.
      - name: Pester
        shell: pwsh
        env:
          PESTER_VERSION: 5.7.1
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $r = Invoke-Pester -Path ./tests/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) teste(s) falharam." }

      # Somente-leitura, executados de verdade. Um código de saída 1 aqui é
      # achado (disco cheio, serviço parado), não defeito — o que interessa é
      # não estourar exceção e devolver saída.
      - name: Rodar os scripts de leitura
        shell: pwsh
        run: |
          $readOnly = @(
            'Get-DiskSpaceReport', 'Get-OpenPorts', 'Get-EventLogErrors',
            'Audit-LocalUsers', 'Get-IncidentTriage',
            'Get-SecurityAudit'
          )
          $failed = @()
          foreach ($name in $readOnly) {
            Write-Host "--- $name"
            try {
              $out = & "./powershell/$name.ps1" 2>&1 | Out-String
              if ([string]::IsNullOrWhiteSpace($out)) { $failed += "$name : não imprimiu nada" }
              else { Write-Host ($out -split "`n" | Select-Object -First 3 | Out-String) }
            }
            catch {
              $failed += "$name : $($_.Exception.Message)"
            }
          }
          if ($failed) { $failed | ForEach-Object { Write-Host "::error::$_" }; throw "$($failed.Count) script(s) falharam." }
          Write-Host "$($readOnly.Count) script(s) rodaram e produziram saída."

      # Os que exigem alvo, apontados para a propria maquina: exercita o caminho
      # completo sem depender de rede externa. Rodar sem alvo testaria a mensagem
      # de erro, nao o script.
      - name: Rodar os scripts que exigem alvo
        shell: pwsh
        run: |
          $failed = @()
          $cases = @(
            @{ Name = 'New-UptimeReport'; Args = @{ Target = 'localhost'; OutputPath = (Join-Path $env:RUNNER_TEMP 'uptime.html') } }
            @{ Name = 'Test-Endpoints'; Args = @{ Target = 'https://github.com' } }
            @{ Name = 'Test-ServiceHealth'; Args = @{ Name = 'W32Time' } }
            @{ Name = 'Test-NetworkPath'; Args = @{ Target = '127.0.0.1'; Count = 1 } }
          )
          foreach ($c in $cases) {
            Write-Host "--- $($c.Name)"
            try {
              $splat = $c.Args
              $out = & "./powershell/$($c.Name).ps1" @splat 2>&1 | Out-String
              if ([string]::IsNullOrWhiteSpace($out)) { $failed += "$($c.Name) : nao imprimiu nada" }
            }
            catch {
              $failed += "$($c.Name) : $($_.Exception.Message)"
            }
          }
          if ($failed) { $failed | ForEach-Object { Write-Host "::error::$_" }; throw "$($failed.Count) script(s) falharam." }
          Write-Host "$($cases.Count) script(s) com alvo rodaram."

      # A descoberta continua automatica, mas os argumentos sao declarados: nem
      # todo script aceita ser chamado sem nada, e adivinhar isso pela AST nao
      # funciona (Test-NetworkPath exige alvo por 'throw', porque aceita
      # -Target OU -InputFile e nenhum dos dois pode ser Mandatory).
      # Script novo com -AsJson roda sem argumento; se precisar de algum, o CI
      # falha e alguem acrescenta aqui - que e exatamente o aviso desejado.
      - name: Conferir a saida JSON
        shell: pwsh
        run: |
          $argsFor = @{
            'Test-NetworkPath'    = @{ Target = '127.0.0.1' }
            'Repair-CommonIssues' = $null   # exige -Repair: reparo sem alvo nao roda
          }

          $checked = 0
          $skipped = @()
          foreach ($f in Get-ChildItem ./powershell -Filter *.ps1) {
            if ((Get-Content $f.FullName -Raw) -notmatch '\[switch\]\$AsJson') { continue }

            $name = $f.BaseName
            if ($argsFor.ContainsKey($name) -and $null -eq $argsFor[$name]) {
              $skipped += $name
              continue
            }
            # Hashtable, nao array: splat de array passa tudo como posicional,
            # entao '-Target' virava o valor da posicao 0 e o IP ficava sem lugar.
            # E atribuir com if/else desenrola o vazio e deixa $extra nulo, que o
            # splat manda como posicional 0 e cai em -Hours.
            $extra = @{}
            if ($argsFor.ContainsKey($name)) { $extra = $argsFor[$name] }

            $raw = & $f.FullName @extra -AsJson 2>$null | Out-String
            try { $null = $raw | ConvertFrom-Json }
            catch { Write-Host "::error::$name devolveu JSON invalido"; throw }
            Write-Host "OK  $name"
            $checked++
          }
          foreach ($s in $skipped) { Write-Host "--  $s (fora da execucao automatica)" }
          if ($checked -lt 3) { throw "So $checked script(s) conferidos; a descoberta quebrou." }
          Write-Host "$checked com JSON validado em Windows real."

      # O debloat NUNCA é aplicado no CI. Só o plano, que não altera nada.
      - name: Plano do debloat (sem aplicar)
        shell: pwsh
        run: |
          foreach ($preset in 'Minimal', 'Recommended', 'Aggressive') {
            $plan = & ./debloat/Invoke-Debloat.ps1 -Preset $preset -AsJson | ConvertFrom-Json
            if ($plan.applied) { throw 'O plano relatou applied=true sem -Apply.' }
            Write-Host "$preset : $($plan.actions.Count) ação(ões)"
          }

      # -WhatIf tem de percorrer o caminho de aplicação sem mudar nada.
      - name: -WhatIf não altera o sistema
        shell: pwsh
        run: |
          $before = (Get-AppxPackage | Measure-Object).Count
          & ./debloat/Invoke-Debloat.ps1 -Preset Minimal -Apply -WhatIf -NoRestorePoint | Out-Null
          $after = (Get-AppxPackage | Measure-Object).Count
          if ($before -ne $after) { throw "-WhatIf removeu pacotes: $before -> $after" }
          Write-Host "-WhatIf preservou os $after pacote(s) instalados."

  format:
    name: Formatação (shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # -d mostra o diff e falha se algo estiver fora do padrão.
      # Para corrigir localmente: shfmt -i 2 -ci -w bash/*.sh
      - name: shfmt
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt mvdan/shfmt:v3-alpine -i 2 -ci -d bash/ tools/ menu.sh install.sh

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks varre o histórico, não só o commit atual

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Higiene — quebras de linha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # CRLF num .sh quebra o script em Linux/macOS ("bad interpreter").
      # O .gitattributes previne; isto é a rede de segurança.
      # Script sem bit de execução obriga o usuário a chamar 'bash script.sh'.
      # Os 8 scripts novos foram commitados como 644 e o CI só percebeu quando
      # a validação tentou executá-los.
      - name: Garantir que os scripts são executáveis
        run: |
          bad=$(find bash tools . -maxdepth 2 -name '*.sh' ! -perm -u+x -print)
          if [ -n "$bad" ]; then
            echo "::error::Sem bit de execução (use: git update-index --chmod=+x <arquivo>):"
            echo "$bad"; exit 1
          fi
          echo "Todos os scripts são executáveis."

      # A versão é embutida em cada script (eles são standalone); este check é
      # o que impede um deles de ficar para trás numa troca de versão.
      - name: Versão consistente com o arquivo VERSION
        run: |
          want=$(cat VERSION)
          fail=0
          # O manifesto do módulo PowerShell também carrega a versão
          psd=$(grep -oP "ModuleVersion\s*=\s*'\K[^']+" powershell/OpsToolkit.psd1)
          if [ "$psd" != "$want" ]; then
            echo "::error file=powershell/OpsToolkit.psd1::declara '$psd', esperado '$want'"; fail=1
          fi
          for f in bash/*.sh; do
            got=$(grep -oP 'OPS_TOOLKIT_VERSION="\K[^"]+' "$f" | head -1)
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::declara '$got', esperado '$want'"; fail=1
            fi
          done
          exit $fail

      # As referencias em docs/ sao geradas a partir do cabecalho dos scripts.
      # Sem este check elas voltam a divergir, que e como o "full reference" do
      # Bash passou a documentar 2 dos 16 scripts sem ninguem notar.
      - name: docs/ em dia com os cabecalhos
        run: ./tools/gen-docs.sh -c

      - name: Garantir LF nos scripts shell
        run: |
          bad=$(find bash -name '*.sh' -exec grep -lU $'\r' {} + || true)
          if [ -n "$bad" ]; then
            echo "::error::Arquivos com CRLF (precisam de LF):"; echo "$bad"; exit 1
          fi
          echo "Todos os .sh estão em LF."
